<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolos - Suzane Figueiredo</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        
        body { 
            margin: 0; 
            min-height: 100vh; 
            background-color: #0d0d0d;
            background-image: radial-gradient(circle at 50% 30%, #1a1a1a 0%, #050505 100%); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Playfair Display', serif; 
            padding: 20px;
        }
        
        .container { 
            text-align: center; 
            width: 100%;
            max-width: 800px;
        }
        
        .btn-voltar { 
            position: absolute; top: 30px; left: 30px;
            background: none; border: 1px solid #D4B06A; color: #D4B06A; 
            padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; 
            text-transform: uppercase; font-family: Arial, sans-serif; transition: 0.2s;
        }
        .btn-voltar:active { background: #D4B06A; color: #000; }

        h1 { color: #D4B06A; text-transform: uppercase; letter-spacing: 3px; font-size: 28px; margin-bottom: 40px; }
        
        .menu-botoes { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
        }
        
        .btn-menu { 
            background: linear-gradient(180deg, #d3ab65 0%, #a87c3e 100%); 
            border: 1px solid #f2daa6; 
            border-radius: 8px; 
            padding: 30px 20px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 15px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.6); 
            transition: transform 0.2s; text-decoration: none;
        }
        
        .btn-menu:active { transform: scale(0.97); }
        .btn-menu i { font-size: 32px; color: #2b1d0f; }
        .btn-menu span { font-size: 18px; font-family: 'Playfair Display', serif; color: #2b1d0f; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        @media (max-width: 600px) {
            .menu-botoes { grid-template-columns: 1fr; }
            .btn-voltar { position: static; margin-bottom: 30px; display: block; width: 100%; }
        }
    </style>
</head>
<body>
    <button class="btn-voltar" onclick="window.location.href='/'"><i class="fa-solid fa-arrow-left"></i> Voltar</button>

    <div class="container">
        <h1>Protocolos Shape Space</h1>
        
        <div class="menu-botoes">
            <a href="#" class="btn-menu">
                <i class="fa-solid fa-spa"></i>
                <span>Shape Space</span>
            </a>
            
            <a href="/formulario_shape" class="btn-menu">
                <i class="fa-solid fa-bolt"></i>
                <span>Shape Com Eletro Full</span>
            </a>
            
            <a href="/formulario_shape" class="btn-menu">
                <i class="fa-solid fa-bolt"></i>
                <span>Shape Com Eletro Mid</span>
            </a>
            
            <a href="/formulario_shape" class="btn-menu">
                <i class="fa-solid fa-heart-pulse"></i>
                <span>Shape Com Lipedema</span>
            </a>
        </div>
    </div>
</body>
</html>
