<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados Cadastrais - Suzane Figueiredo</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0; padding: 20px; min-height: 100vh;
            background-color: #080808;
            font-family: Arial, sans-serif; color: #ddd;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .btn-voltar {
            position: absolute; top: 20px; left: 20px;
            background: none; border: 1px solid #D4B06A; color: #D4B06A;
            padding: 8px 20px; font-size: 14px; border-radius: 6px; cursor: pointer;
            text-transform: uppercase; transition: all 0.2s;
        }
        .btn-voltar:active { background: #D4B06A; color: #000; }

        .container {
            width: 100%; max-width: 800px;
            background: #000000; border: 1px solid #D4B06A; border-radius: 8px;
            padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            margin-top: 40px;
        }

        h2 { font-family: 'Playfair Display', serif; color: #D4B06A; text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-top: 0; margin-bottom: 30px; font-size: 22px;}

        .form-grid { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 20px; 
        }

        .col-2 { grid-column: span 2; }
        .col-3 { grid-column: span 3; }
        .col-6 { grid-column: span 6; }

        .grupo-input { display: flex; flex-direction: column; gap: 8px; }
        .grupo-input label { font-size: 12px; color: #D4B06A; text-transform: uppercase; letter-spacing: 0.5px;}
        .grupo-input input, .grupo-input select {
            padding: 12px; font-size: 14px; border-radius: 4px;
            border: 1px solid #333; background: #111; color: #aaa; outline: none;
            width: 100%;
        }
        .grupo-input input:focus, .grupo-input select:focus { border-color: #D4B06A; color: white; }

        .linha-tracejada {
            border-top: 1px dashed #D4B06A;
            margin: 10px 0;
            width: 100%;
        }

        .titulo-emergencia {
            font-size: 14px; color: #D4B06A; font-weight: bold; margin-bottom: 0;
        }

        .btn-salvar {
            width: 100%; padding: 18px; font-size: 16px; border-radius: 6px; cursor: pointer;
            font-family: 'Playfair Display', serif; font-weight: bold; text-transform: uppercase;
            background: linear-gradient(135deg, #e3c48e 0%, #c4995a 40%, #9e7135 100%);
            border: none; color: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-top: 20px;
        }
        .btn-salvar:active { transform: scale(0.98); }

        @media (max-width: 600px) {
            .col-2, .col-3 { grid-column: span 6; }
        }
    </style>
</head>
<body>

    <button class="btn-voltar" onclick="window.location.href='/'"><i class="fa-solid fa-arrow-left"></i> VOLTAR</button>

    <div class="container">
        <h2>Ficha de Dados Cadastrais</h2>

        <form id="formCadastro" onsubmit="salvarCadastro(event)">
            <div class="form-grid">
                
                <div class="grupo-input col-3">
                    <label>Data:</label>
                    <input type="date" id="data_cadastro">
                </div>
                <div class="grupo-input col-3">
                    <label>Sexo:</label>
                    <select id="sexo">
                        <option>Selecione...</option>
                        <option>Feminino</option>
                        <option>Masculino</option>
                    </select>
                </div>

                <div class="grupo-input col-3">
                    <label>Nome Completo:</label>
                    <input type="text" id="nome" required placeholder="Digite seu nome completo">
                </div>
                <div class="grupo-input col-3">
                    <label>RG / CPF:</label>
                    <input type="text" id="documento" required placeholder="Documento de identidade">
                </div>

                <div class="grupo-input col-2">
                    <label>Data de Nasc.:</label>
                    <input type="date" id="data_nascimento">
                </div>
                <div class="grupo-input col-2">
                    <label>Idade:</label>
                    <input type="number" id="idade" required placeholder="Ex: 30">
                </div>
                <div class="grupo-input col-2">
                    <label>Estado Civil:</label>
                    <select id="estado_civil">
                        <option>Selecione...</option>
                        <option>Solteiro(a)</option>
                        <option>Casado(a)</option>
                    </select>
                </div>

                <div class="grupo-input col-3">
                    <label>E-mail:</label>
                    <input type="email" id="email" required placeholder="cliente@email.com">
                </div>
                <div class="grupo-input col-3">
                    <label>Telefone Fixo:</label>
                    <input type="text" id="telefone_fixo" placeholder="( )">
                </div>

                <div class="grupo-input col-3">
                    <label>Celular / WhatsApp:</label>
                    <input type="text" id="celular" required placeholder="( ) 9XXXX-XXXX">
                </div>
                <div class="grupo-input col-3">
                    <!-- Espaço vazio para manter a estrutura da imagem -->
                </div>

                <div class="grupo-input col-6">
                    <label>Endereço Completo:</label>
                    <input type="text" id="endereco" placeholder="Rua, Número, Complemento">
                </div>

                <div class="grupo-input col-2">
                    <label>Bairro:</label>
                    <input type="text" id="bairro">
                </div>
                <div class="grupo-input col-2">
                    <label>Cidade:</label>
                    <input type="text" id="cidade">
                </div>
                <div class="grupo-input col-2">
                    <label>Estado:</label>
                    <input type="text" id="estado" placeholder="Ex: RJ">
                </div>

                <div class="grupo-input col-2">
                    <label>CEP:</label>
                    <input type="text" id="cep" placeholder="00000-000">
                </div>
                <div class="grupo-input col-4">
                    <!-- Espaço vazio -->
                </div>

                <div class="col-6">
                    <div class="linha-tracejada"></div>
                    <div class="titulo-emergencia">Em caso de emergência avisar:</div>
                </div>

                <div class="grupo-input col-2">
                    <label>Nome do Contato:</label>
                    <input type="text" id="contato_emergencia" placeholder="Nome">
                </div>
                <div class="grupo-input col-2">
                    <label>Telefone:</label>
                    <input type="text" id="telefone_emergencia" placeholder="( )">
                </div>
                <div class="grupo-input col-2">
                    <label>Grau de Parentesco:</label>
                    <input type="text" id="parentesco" placeholder="Ex: Mãe, Cônjuge">
                </div>

                <div class="col-6">
                    <button type="submit" class="btn-salvar"><i class="fa-solid fa-check"></i> SALVAR CADASTRO</button>
                </div>

            </div>
        </form>
    </div>

    <script>
        async function salvarCadastro(event) {
            event.preventDefault();

            // Captura o nome e a IDADE que você digitou no formulário
            const dados = {
                nome: document.getElementById('nome').value.trim(),
                idade: document.getElementById('idade').value,
                email: document.getElementById('email').value.trim()
            };

            const resposta = await fetch('/dados', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            const res = await resposta.json();
            if (res.status === "sucesso") {
                alert('Ficha Cadastral salva com sucesso!');
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
